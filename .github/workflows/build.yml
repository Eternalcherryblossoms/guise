name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # AGP 8.x supports JDK 17-21. Pinning 21 keeps the toolchain deterministic.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships an Android SDK but not necessarily the exact platform and
      # build-tools this project pins, so they are installed explicitly.
      #
      # Note what is NOT used here: android-actions/setup-android. Its default flow runs
      # `sdkmanager tools`, and Google has since removed the `tools` package from the SDK
      # repository, so the action fails before any project step executes. Resolving
      # sdkmanager defensively also survives the runner image moving its cmdline-tools.
      - name: Install SDK platform and build tools
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # The coherence rules are tested on the desktop JVM, which is the point of :core
      # having no Android dependencies: the part most likely to be wrong is the part that
      # does not need a rooted handset to verify.
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      # The shipped catalog is a *function* of catalog/seed/corpus.json, and this is what makes
      # that true rather than aspirational: it fails if the committed asset has drifted from the
      # seed, if any entry lost its attribution, or if a required memory tier has no device and
      # no written waiver. Hand-editing the shipped catalog is therefore not possible without
      # the build noticing.
      - name: Verify the device catalog matches its seed
        run: ./gradlew :catalog-gen:run --args="--check" --stacktrace

      - name: Assemble
        run: ./gradlew :xposed:assembleDebug :app:assembleDebug :probe:assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            probe/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Publishing is driven by a tag, not by every push to main: an update check that offered a
  # release for each commit would be worse than no update check.
  #
  #   git tag v5.1.0 && git push origin v5.1.0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # find rather than a glob: upload-artifact preserves each file's path relative to
          # the repo root, so the APKs land at apks/app/build/... and apks/probe/build/...,
          # and a naive apks/*.apk matches nothing. (It did, on the first attempt.)
          mapfile -t apks < <(find apks -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "no APK found under apks/"; find apks -type f | head -20; exit 1
          fi
          printf '%s\n' "${apks[@]}"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${apks[@]}"
