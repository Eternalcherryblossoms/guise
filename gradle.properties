# Project-wide Gradle settings. Portable: nothing here is specific to one machine.
#
# Machine-specific settings (an explicit JDK path, an HTTP proxy, sandbox workarounds) live in
# $GRADLE_USER_HOME/gradle.properties, which is not committed. Keeping the split means CI runs
# without editing this file, and a contributor is not handed someone else's proxy address.

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- Android ---------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
